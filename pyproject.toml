[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0",
    "httpx>=0.27",
    "openai>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
